name: BidBayVN cron pings
on:
  schedule:
    - cron: "*/5 * * * *"
    - cron: "7 8 * * *"
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping cron endpoints
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          base="https://bidbayvn.com"
          if [ "$SCHEDULE" = "7 8 * * *" ]; then
            curl -fsS -H "Authorization: Bearer $CRON_SECRET" "$base/api/cron/daily"
          else
            curl -fsS -H "Authorization: Bearer $CRON_SECRET" "$base/api/cron/emails"
            minute=$(date -u +%M)
            if [ $((10#${minute} % 10)) -eq 0 ]; then
              curl -fsS -H "Authorization: Bearer $CRON_SECRET" "$base/api/cron/payments"
            fi
          fi
